<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Shakespeare or Not?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cinzel:wght@600;800&family=Nunito:wght@700;800;900&family=Lora:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#f2b93a; --gold-l:#ffe28a; --gold-d:#a8691a; --ink:#2a1a0c; --brown:#3a2010;
  --red:#c4172f; --red-d:#7a0d1c; --green:#1f9b46; --green-d:#0f5a28;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#120806;font-family:'Nunito','Lora',sans-serif;color:var(--ink);user-select:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* =============== LIBRARY STAGE =============== */
#stage{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 55% at 50% 45%,rgba(255,176,70,.34),transparent 70%),
    radial-gradient(ellipse at 50% 40%,#6a3a1b 0%,#3a1c0d 48%,#150808 100%)}
.shelfBG{position:absolute;top:0;bottom:0;width:20vw;opacity:.6;filter:blur(2.5px) saturate(.9);
  background:
   repeating-linear-gradient(0deg,#1b0e07 0 8px,transparent 8px 19vh),
   repeating-linear-gradient(90deg,#7a2a1a 0 9px,#254a3c 9px 17px,#8a6a22 17px 30px,#35295c 30px 38px,#9a3a2a 38px 47px,#2a3a5a 47px 58px,#6a4a22 58px 66px,#3e5a2a 66px 74px) 0 0/100% 19vh repeat-y}
.shelfBG.l{left:0;-webkit-mask-image:linear-gradient(90deg,#000 35%,transparent);mask-image:linear-gradient(90deg,#000 35%,transparent)}
.shelfBG.r{right:0;-webkit-mask-image:linear-gradient(270deg,#000 35%,transparent);mask-image:linear-gradient(270deg,#000 35%,transparent)}
#sparks{position:absolute;inset:0;pointer-events:none}
.drape{position:absolute;top:0;width:17vw;height:34vh;pointer-events:none;
  background:repeating-linear-gradient(100deg,#7a1020 0 1.4vw,#a81d33 1.4vw 2.6vw,#5a0a17 2.6vw 4vw);
  box-shadow:inset 0 -30px 40px rgba(0,0,0,.45)}
.drape.l{left:0;border-radius:0 0 100% 0/0 0 85% 0}
.drape.r{right:0;border-radius:0 0 0 100%/0 0 0 85%;transform:scaleX(1)}
.lantern{position:absolute;top:-3vh;display:flex;flex-direction:column;align-items:center;transform-origin:top center;animation:swing 6s ease-in-out infinite}
.lantern::before{content:"";width:2px;height:11vh;background:#3a2410}
.lantern i{display:block;width:4.2vh;height:6vh;border-radius:30% 30% 42% 42%;
  background:radial-gradient(circle at 50% 55%,#fff6c8,#ffbb44 55%,#8a4a10);border:2px solid #4a2c12;
  box-shadow:0 0 60px 26px rgba(255,170,60,.45),0 0 14px 4px rgba(255,220,140,.8)}
@keyframes swing{50%{transform:rotate(2.2deg)}}
.stack{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:flex-start;gap:0;pointer-events:none}
.stack i{display:block;height:2.6vh;border-radius:3px;box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 -3px 0 rgba(0,0,0,.25)}
.stack.l{left:1.5vw}.stack.r{right:1.5vw;align-items:flex-end}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.6))}

/* ===== PHOTO BACKGROUND (turns on automatically when bg.jpg is found; otherwise the CSS scene above stays) ===== */
#stage.hasbg{background:#150808 var(--bgurl) center bottom / cover no-repeat}
#stage.hasbg .shelfBG,#stage.hasbg .drape,#stage.hasbg .lantern,#stage.hasbg .stack{display:none}
#stage.hasbg .vignette{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.10) 50%,rgba(0,0,0,.55))}
#stage.hasbg.dim .vignette{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.26) 45%,rgba(0,0,0,.6))}
#stage.hasbg #sparks{opacity:.8}

/* =============== SCENES =============== */
.scene{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:2vh 3vw}
.scene.on{display:flex;animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

.panel{position:relative;background:
   radial-gradient(circle at 18% 12%,rgba(255,255,255,.45),transparent 42%),
   radial-gradient(circle at 90% 95%,rgba(150,90,20,.22),transparent 45%),
   linear-gradient(135deg,#faefcf,#ecd6a0);
  border:3px solid #c39a50;border-radius:20px;
  box-shadow:0 0 0 4px rgba(60,30,6,.55),0 22px 44px rgba(0,0,0,.55),inset 0 0 36px rgba(150,95,25,.25)}
.rb{filter:drop-shadow(0 6px 6px rgba(0,0,0,.5))}
.rb>div{background:linear-gradient(#fbf1d2,#e9d19c);padding:.45em 3em;text-align:center;
  clip-path:polygon(0 0,100% 0,98.2% 50%,100% 100%,0 100%,1.8% 50%);
  box-shadow:inset 0 0 0 3px rgba(185,138,61,.55)}

/* =============== HUD =============== */
#hud{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;padding:1.6vh 1.6vw;pointer-events:none}
#hud button{pointer-events:auto}
.hud-l{display:flex;gap:10px}
.btn-i{width:clamp(36px,5.2vh,50px);height:clamp(36px,5.2vh,50px);border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#4a2a14,#1c0e06);border:2.5px solid var(--gold);color:var(--gold-l);
  font-size:clamp(15px,2.4vh,22px);box-shadow:0 0 0 3px rgba(20,8,2,.55),0 4px 10px rgba(0,0,0,.7);transition:.15s}
.btn-i:hover{transform:scale(1.1) rotate(-5deg)}

/* =============== BUTTONS =============== */
.btn-gold{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font-family:'Nunito',sans-serif;font-weight:900;color:#2a1604;
  font-size:clamp(18px,3.6vh,34px);padding:.5em 1.7em;border-radius:18px;border:3px solid #fff0b0;
  background:linear-gradient(#ffdb62,#f2a91d);box-shadow:0 6px 0 #a56a0a,0 12px 20px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55);transition:.12s}
.btn-gold:hover{transform:translateY(-3px);filter:brightness(1.07)}
.btn-gold:active{transform:translateY(4px);box-shadow:0 2px 0 #a56a0a}
.btn-gold.sm{font-size:clamp(14px,2.7vh,24px);padding:.45em 1.4em}
.btn-dark{background:linear-gradient(#2a2a40,#10101c);color:#fff;border-color:#b7b7d6;box-shadow:0 6px 0 #05050c,0 12px 20px rgba(0,0,0,.5)}
.round{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;font-weight:800;font-size:clamp(11px,1.9vh,15px);text-shadow:0 2px 4px #000}
.round i{font-style:normal;width:clamp(44px,7.4vh,66px);height:clamp(44px,7.4vh,66px);border-radius:50%;display:grid;place-items:center;font-size:clamp(18px,3.2vh,28px);
  background:radial-gradient(circle at 35% 30%,#5a3418,#1c0e06);border:3px solid var(--gold);color:var(--gold-l);box-shadow:0 5px 10px rgba(0,0,0,.55);transition:.15s}
.round:hover i{transform:scale(1.1) rotate(6deg)}

/* =============== MASCOT =============== */
.mas svg{display:block;width:100%;height:auto;filter:drop-shadow(0 12px 14px rgba(0,0,0,.55))}
.mas img{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain;filter:drop-shadow(0 14px 16px rgba(0,0,0,.6))}
.bob svg,.bob img{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(1deg)}}

/* =============== TITLE =============== */
#title .wrap{display:flex;align-items:center;justify-content:center;gap:1vw;width:min(1150px,100%)}
#mTitle{width:clamp(180px,34vw,420px);flex:0 0 auto}
.logoCol{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.logo{position:relative;line-height:.92}
.crown{position:absolute;left:50%;top:-.62em;transform:translateX(-50%) rotate(-6deg);font-size:clamp(26px,6vh,58px);filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.gtxt{font-family:'Playfair Display',serif;font-weight:900;
  background:linear-gradient(#fff5b8,#f6c444 52%,#b56a12);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 0 0 #4a2506) drop-shadow(-2px 0 0 #4a2506) drop-shadow(0 2px 0 #4a2506) drop-shadow(0 -2px 0 #4a2506) drop-shadow(0 7px 0 #7a4410) drop-shadow(0 14px 10px rgba(0,0,0,.55))}
.l1{font-size:clamp(34px,10.5vh,112px);letter-spacing:-.01em}
.l2{display:flex;align-items:center;justify-content:center;gap:.25em;margin-top:.1em}
.l2 .or{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(26px,7vh,76px);color:#fff;
  filter:drop-shadow(2px 0 0 #4a2506) drop-shadow(-2px 0 0 #4a2506) drop-shadow(0 2px 0 #4a2506) drop-shadow(0 -2px 0 #4a2506) drop-shadow(0 6px 0 #7a4410) drop-shadow(0 12px 8px rgba(0,0,0,.5))}
.l2 .not{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(40px,12.5vh,136px);
  background:linear-gradient(#ff7a5a,#d3192e 55%,#8a0c1c);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 0 0 #4a0a12) drop-shadow(-2px 0 0 #4a0a12) drop-shadow(0 2px 0 #4a0a12) drop-shadow(0 -2px 0 #4a0a12) drop-shadow(0 7px 0 #5a0a14) drop-shadow(0 14px 10px rgba(0,0,0,.55))}
.quill{font-size:clamp(26px,6vh,60px);transform:rotate(18deg);margin-left:-.1em;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.sub{margin-top:2.2vh;transform:rotate(-2.2deg)}
.sub>div{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(11px,2.1vh,19px);letter-spacing:.03em;padding:.65em 3em}
.quip{margin-top:1.6vh;font-style:italic;font-family:'Lora',serif;font-weight:500;font-size:clamp(12px,2vh,17px);color:#ffe7b0;text-shadow:0 2px 4px #000;min-height:1.3em}
.menuRow{display:flex;gap:2.6vw;margin-top:2vh}
.logoImg{display:block;width:100%;max-width:820px;height:auto;max-height:46vh;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}

/* =============== QUESTION =============== */
#quiz .qcol{width:min(760px,100%);height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.3vh;padding-top:2vh}
.roundBar{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(14px,2.6vh,24px);padding:.4em 3.4em!important}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;max-width:92%;margin-top:-.3vh}
.dots b{width:clamp(10px,1.9vh,17px);height:clamp(10px,1.9vh,17px);border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4252,#1c1824);border:1.5px solid #6a5a7a}
.dots b.ok{background:radial-gradient(circle at 35% 30%,#fff2a0,#f2b012);border-color:#ffe28a;box-shadow:0 0 10px rgba(255,200,60,.9)}
.dots b.bad{background:radial-gradient(circle at 35% 30%,#ffb0b0,#d32a3c);border-color:#ff9a9a;box-shadow:0 0 10px rgba(255,80,90,.8)}
.dots b.cur{background:radial-gradient(circle at 35% 30%,#fff,#f2b93a);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.35)}}
.hudRow{display:flex;gap:16px;font-family:'Nunito',sans-serif;font-weight:900;color:var(--gold-l);font-size:clamp(11px,1.9vh,16px);letter-spacing:.08em;text-shadow:0 2px 3px #000}
.timerBar{width:min(380px,66%);height:11px;border-radius:8px;background:#1b0d08;border:2px solid #6a4a1a;overflow:hidden}
.timerBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#46d46e,#f2c43a);transform-origin:left}
.timerBar.low i{background:linear-gradient(90deg,#ff7a3a,#ff2d4a)}
.bookWrap{position:relative;display:flex;justify-content:center;perspective:1200px;margin-top:.6vh}
.book{position:relative;width:clamp(170px,31vh,290px);aspect-ratio:3/4.1;border-radius:6px 14px 14px 6px;
  background:
    radial-gradient(ellipse at 30% 20%,rgba(255,200,120,.16),transparent 55%),
    linear-gradient(135deg,#5a3320,#2c180c 62%,#1a0d06);
  border:3px solid #6a4420;box-shadow:-9px 0 0 #1c0f07,0 24px 40px rgba(0,0,0,.7),inset 0 0 50px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:bookIn .55s cubic-bezier(.2,1.3,.4,1)}
@keyframes bookIn{from{transform:rotateY(-70deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
.book::before{content:"";position:absolute;inset:9px;border:2px solid var(--gold-d);border-radius:4px;opacity:.9;box-shadow:inset 0 0 0 5px rgba(0,0,0,.12),inset 0 0 0 6px rgba(168,105,26,.55)}
.bt{font-family:'Cinzel',serif;font-weight:800;color:#f6dc8a;text-transform:uppercase;line-height:1.12;width:76%;margin:0 12%;overflow-wrap:normal;word-break:normal;hyphens:none;letter-spacing:.03em;text-shadow:0 3px 6px #000,0 0 18px rgba(255,200,90,.35)}
.orn{margin-top:1.4vh;color:var(--gold);font-size:clamp(18px,3.4vh,32px);filter:drop-shadow(0 2px 3px #000)}
.orn.top{margin:0 0 1.4vh}
.thought{position:absolute;right:-34%;top:2%;z-index:4;width:clamp(60px,12vh,110px);height:clamp(50px,9.4vh,92px);display:grid;place-items:center;
  background:#fffdf5;border-radius:50% 52% 48% 50%;box-shadow:0 8px 14px rgba(0,0,0,.45);font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(28px,6vh,58px);color:#2a1a0c;animation:bob 2.8s ease-in-out infinite}
.thought::before,.thought::after{content:"";position:absolute;background:#fffdf5;border-radius:50%;box-shadow:0 4px 8px rgba(0,0,0,.35)}
.thought::before{width:22%;height:26%;left:6%;bottom:-18%}
.thought::after{width:12%;height:14%;left:-6%;bottom:-34%}
#reveal.m3 #mRev{left:-17vw;width:clamp(170px,32vh,340px)}
#reveal.m4 #mRev{left:-13vw;width:clamp(130px,25vh,250px)}
#quiz.m2 .thought{display:none}
#quiz.m2 #mQuiz{right:-106%;width:112%;max-width:340px}
#mQuiz{position:absolute;right:-84%;bottom:3vh;width:clamp(130px,27vh,260px);z-index:4;pointer-events:none}
.qBar{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(16px,3.1vh,30px);padding:.5em 2.4em!important;white-space:nowrap}
.qWrap{margin-top:-5.5vh;position:relative;z-index:5}
.answers{display:flex;gap:2vw;width:min(640px,100%);justify-content:center;margin-top:.4vh}
.ans{flex:1;display:flex;align-items:center;justify-content:center;gap:.4em;font-family:'Nunito',sans-serif;font-weight:900;color:#fff;
  font-size:clamp(20px,4vh,38px);padding:.42em 0;border-radius:40px;border:3px solid #f6e6a0;text-shadow:0 2px 3px rgba(0,0,0,.55);transition:.12s}
.ans.y{background:linear-gradient(#35c05c,#127030);box-shadow:0 6px 0 #0a3d18,0 12px 20px rgba(0,0,0,.5)}
.ans.n{background:linear-gradient(#e03450,#8a1024);box-shadow:0 6px 0 #4a0612,0 12px 20px rgba(0,0,0,.5)}
.ans:hover{transform:translateY(-3px);filter:brightness(1.1)}
.ans:active{transform:translateY(4px)}
.ans:disabled{pointer-events:none;opacity:.6}
.hint{font-size:clamp(10px,1.6vh,13px);color:#d9b878;font-weight:800;letter-spacing:.08em;opacity:.8}

/* =============== REVEAL =============== */
#reveal .col{position:relative;width:min(900px,100%);display:flex;flex-direction:column;align-items:center;gap:1.8vh;max-height:100%}
.vbar{display:flex;flex-direction:column;align-items:center;gap:.1em;padding:.55em 3.6em!important}
.vtop{display:flex;align-items:center;gap:.35em;font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(26px,5.6vh,54px);line-height:1}
.vicon{width:1.15em;height:1.15em;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.78em;box-shadow:0 4px 8px rgba(0,0,0,.4),inset 0 -4px 0 rgba(0,0,0,.2)}
.vbar.ok .vtop{color:var(--green-d)}.vbar.ok .vicon{background:radial-gradient(circle at 35% 30%,#47d870,#12792f)}
.vbar.bad .vtop{color:var(--red)}.vbar.bad .vicon{background:radial-gradient(circle at 35% 30%,#ff6a78,#a8101f)}
.vsub{font-family:'Lora',serif;font-weight:700;font-size:clamp(13px,2.3vh,21px);color:#3a2410}
.rcard{display:flex;gap:2.4vw;padding:clamp(14px,3vh,30px);width:100%;align-items:flex-start;overflow:auto;max-height:58vh}
.mini{flex:0 0 clamp(100px,19vh,180px);aspect-ratio:3/4.2;border-radius:4px 10px 10px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;
  box-shadow:-6px 0 0 rgba(0,0,0,.45),0 12px 20px rgba(0,0,0,.5);border:2px solid rgba(0,0,0,.4);color:#fff7e0;padding:8px;position:relative;overflow:hidden}
.mini::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.2),transparent 40%)}
.mini .g{font-size:clamp(28px,6.4vh,58px);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.mini .tt{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(11px,2vh,18px);line-height:1.1;text-shadow:0 2px 3px #000}
.mini .au{font-family:'Cinzel',serif;font-size:clamp(7px,1.2vh,10px);letter-spacing:.1em;opacity:.9}
.mini .miss{font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(8px,1.3vh,11px);opacity:.75;word-break:break-all;margin-top:4px}
.mini.hasimg{flex:0 0 auto;width:clamp(110px,21vh,210px);aspect-ratio:auto;padding:0;background:#000;display:block}
.mini.hasimg img{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain}
.mini.hasimg::after{display:none}
.rtxt{flex:1;min-width:0}
.pillRow{display:flex;align-items:center;gap:.8em;flex-wrap:wrap}
.pill{display:inline-block;padding:.3em 1.1em;border-radius:9px;font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(11px,2vh,17px);color:#fff;background:linear-gradient(#b81d34,#74101f);border:1.5px solid #3e0610;box-shadow:0 2px 0 #3e0610}
.auth{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(18px,3.4vh,32px);color:#2a1a0c}
.rtxt h3{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(15px,2.7vh,24px);margin-top:1.2vh;line-height:1.1}
.rtxt p{font-family:'Lora',serif;font-weight:500;font-size:clamp(13px,2.25vh,19px);line-height:1.5;margin-top:.8vh}
.focus{margin-top:1.8vh;padding:1vh 1.2vw;border:1.5px solid #cda55a;border-radius:12px;background:rgba(255,255,255,.4);display:flex;gap:12px;align-items:flex-start;font-family:'Lora',serif;font-weight:500;font-size:clamp(12px,2vh,17px);line-height:1.4}
.focus b{display:block;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.06em}
.focus .bulb{font-size:clamp(22px,4vh,38px);line-height:1;filter:drop-shadow(0 0 8px rgba(255,210,70,.8))}
.bonus{color:var(--gold-l);font-family:'Nunito',sans-serif;font-weight:900;letter-spacing:.08em;text-shadow:0 2px 4px #000;font-size:clamp(12px,2vh,17px);min-height:1.3em}
.revFoot{display:flex;justify-content:flex-end;width:100%}
#mRev{position:absolute;left:-12vw;bottom:-6vh;width:clamp(140px,30vh,290px);z-index:6;pointer-events:none}

/* =============== RESULT =============== */
#result .wrap{display:flex;align-items:center;justify-content:center;gap:1vw;width:min(1000px,100%)}
#mRes{width:clamp(170px,32vw,400px);flex:0 0 auto}
#result .rcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:2vh;min-width:0}
.gc{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(26px,6vh,56px)!important;padding:.35em 2em!important}
.scorePanel{padding:clamp(14px,2.6vh,28px) clamp(18px,3vw,36px);width:min(480px,100%);text-align:center}
.scorePanel .lbl{font-family:'Nunito',sans-serif;font-weight:900;font-size:clamp(14px,2.6vh,22px)}
.scorePanel .big{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(46px,12vh,104px);line-height:1;color:#2a1a0c}
.scorePanel .big span{font-size:.62em;font-weight:700;opacity:.8}
.statRow{display:grid;grid-template-columns:repeat(3,1fr);margin-top:1.4vh;border-top:2px solid rgba(185,138,61,.55);padding-top:1.4vh}
.statRow>div{padding:0 .6vw;font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(10px,1.8vh,15px);line-height:1.25}
.statRow>div+div{border-left:2px solid rgba(185,138,61,.45)}
.statRow b{display:block;font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(22px,4.4vh,40px)}
.stIcon{font-size:clamp(20px,3.6vh,34px);display:block}
.extra{margin-top:1.2vh;font-family:'Lora',serif;font-style:italic;font-weight:700;font-size:clamp(12px,2vh,17px);color:#7a1020}
.rowBtns{display:flex;gap:1.6vw;justify-content:center;flex-wrap:wrap}

/* =============== REVIEW =============== */
#review .rv{width:min(900px,100%);display:flex;flex-direction:column;align-items:center;gap:2vh;max-height:100%}
.rvTitle{display:flex;flex-direction:column;align-items:center;padding:.4em 3em!important}
.rvTitle b{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(22px,4.6vh,42px)}
.rvTitle small{font-family:'Lora',serif;font-weight:700;font-size:clamp(11px,1.9vh,16px);color:#4a3015}
.rvPanel{padding:clamp(12px,2vh,22px);width:100%;overflow:auto;max-height:76vh}
.rvGrid{display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:repeat(10,auto);gap:.9vh 1.4vw}
.rvRow{display:flex;align-items:center;gap:.7em;padding:.35em .6em .35em .35em;border-radius:12px;background:rgba(255,255,255,.55);border:1.5px solid #d3b373;text-align:left;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:clamp(12px,2.1vh,18px);transition:.12s;min-width:0}
.rvRow:hover{background:#fff;transform:translateX(3px);box-shadow:0 3px 8px rgba(0,0,0,.25)}
.rvRow .n{flex:0 0 auto;width:2em;height:2em;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:.9em;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.rvRow .n.ok{background:radial-gradient(circle at 35% 30%,#47d870,#12792f)}
.rvRow .n.bad{background:radial-gradient(circle at 35% 30%,#ff6a78,#a8101f)}
.rvRow .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rvRow .mk{flex:0 0 auto;font-weight:900}
.rvRow .mk.ok{color:var(--green)}.rvRow .mk.bad{color:var(--red)}
#review .backBtn{position:absolute;top:9vh;left:1.6vw}
#confetti{position:fixed;inset:0;z-index:40;pointer-events:none}

/* =============== MODAL =============== */
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,2,3,.78);display:none;align-items:center;justify-content:center;padding:4vh 4vw;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mbox{width:min(620px,100%);max-height:88vh;overflow:auto;padding:clamp(18px,3vh,32px);animation:fadeUp .3s}
.mbox h2{font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(22px,4vh,34px);text-align:center;margin-bottom:1.4vh}
.mbox p,.mbox li{font-family:'Lora',serif;font-weight:500;font-size:clamp(13px,2.1vh,17px);line-height:1.5}
.mbox ul{padding-left:1.2em;margin:1vh 0}
.mbox .close{float:right;font-size:22px;font-weight:900;color:var(--red)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.9vh 0;border-bottom:1px dashed #b98a3d;font-size:clamp(12px,2vh,16px)}
.srow label{font-family:'Nunito',sans-serif;font-weight:900}
.seg{display:flex;gap:6px}
.seg button{padding:.3em .9em;border:2px solid #9c722a;border-radius:20px;font-family:'Nunito',sans-serif;font-weight:900;background:rgba(255,255,255,.5)}
.seg button.sel{background:var(--red);color:#fff;border-color:var(--red-d)}
input[type=range]{accent-color:var(--red);width:180px}
.hs{display:flex;justify-content:space-between;padding:.8vh 0;border-bottom:1px dashed #b98a3d;font-family:'Nunito',sans-serif;font-weight:800}

.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.flashG{animation:fg .5s}.flashR{animation:fr .5s}
@keyframes fg{from{box-shadow:inset 0 0 0 100vmax rgba(60,220,110,.26)}}
@keyframes fr{from{box-shadow:inset 0 0 0 100vmax rgba(240,50,70,.28)}}

@media (max-width:820px){
  #title .wrap,#result .wrap{flex-direction:column}
  #mTitle{width:46vw}#mRes{width:40vw}
  .logoImg{max-height:30vh}
  .shelfBG,.stack{display:none}
  .rcard{flex-direction:column;align-items:center}
  #mRev{left:-2vw;bottom:-4vh;width:22vw;opacity:.95}
  #mQuiz{right:-1%;bottom:2vh;width:30vw}.thought{right:3%;top:-3%}
  #quiz.m2 #mQuiz{right:-2%;bottom:2vh;width:40vw;max-width:none}
  #reveal.m3 #mRev{left:-2vw;bottom:-4vh;width:34vw}
  #reveal.m4 #mRev{left:-2vw;bottom:-4vh;width:26vw}
  .rvGrid{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}
  .qBar{white-space:normal}
}
@media (max-height:560px){.hint{display:none}.qWrap{margin-top:-3vh}}
</style>
</head>

/* ===== BOOK COVERS (shown on the reveal card) =====
   Book_1.jpg ... Book_20.jpg go next to index.html (or in images/, covers/, img/ or assets/).
   .jpg / .jpeg / .png / .webp all work, and upper/lower case file names are tried.
   If an image is missing, the card shows the emoji cover plus the file name it was looking for. */
const COVER_FILES = {
 "A Midsummer Night's Dream":"Book_1.jpg",
 "Alice's Adventures in Wonderland":"Book_2.jpg",
 "The Divine Comedy":"Book_3.jpg",
 "Frankenstein":"Book_4.jpg",
 "Hamlet":"Book_5.jpg",
 "Julius Caesar":"Book_6.jpg",
 "King Lear":"Book_7.jpg",
 "Macbeth":"Book_8.jpg",
 "Oliver Twist":"Book_9.jpg",
 "Othello":"Book_10.jpg",
 "Pride and Prejudice":"Book_11.jpg",
 "Romeo and Juliet":"Book_12.jpg",
 "The Canterbury Tales":"Book_13.jpg",
 "The Great Gatsby":"Book_14.jpg",
 "The Importance of Being Earnest":"Book_15.jpg",
 "The Merchant of Venice":"Book_16.jpg",
 "The Odyssey":"Book_17.jpg",
 "The Scarlet Letter":"Book_18.jpg",
 "The Tempest":"Book_19.jpg",
 "Twelfth Night":"Book_20.jpg"
};
const COVER_DIRS = ['', 'images/', 'covers/', 'img/', 'assets/', 'pictures/'];
const COVER_EXTS = ['.jpg','.jpeg','.png','.webp','.JPG','.PNG'];
let coverPat = null, searchedFull = false; const coverP = {};
function coverList(file, full){
  const base = file.replace(/\.[^.]+$/,''), out = [];
  const add = (d,n,e) => { if(!out.some(o=>o.u===d+n+e)) out.push({u:d+n+e,d,e}); };
  if(coverPat){ add(coverPat.d,base,coverPat.e); add(coverPat.d,base.toLowerCase(),coverPat.e); }
  add('',base,'.jpg');
  if(full) for(const d of COVER_DIRS) for(const n of [base,base.toLowerCase()]) for(const e of COVER_EXTS) add(d,n,e);
  return out;
}
function tryList(list){
  return new Promise(res=>{
    let i = 0; const im = new Image();
    im.onload  = () => res(list[i]);
    im.onerror = () => { i++; if(i < list.length) im.src = list[i].u; else res(null); };
    im.src = list[0].u;
  });
}
function findCover(w){
  if(coverP[w.t]) return coverP[w.t];
  const file = COVER_FILES[w.t];
  if(!file) return (coverP[w.t] = Promise.resolve(null));
  const full = !coverPat && !searchedFull; if(full) searchedFull = true;
  return (coverP[w.t] = tryList(coverList(file, full)).then(hit => {
    if(!hit) return null;
    if(!coverPat) coverPat = {d:hit.d, e:hit.e};
    return hit.u;
  }));
}

const bgm = new Audio();
bgm.loop = true; bgm.preload = 'auto'; bgm.volume = SETTINGS.volume;
const bgmSources = ['bgm_1.mp3','bgm_1.wav','bgm_1.ogg','bgm_1.m4a','bgm_1.aac','bgm_1.mp4','bgm_1.flac','bgm_1'];
let bgmIdx = 0, bgmReady = false, bgmWanted = false;
function loadBgm(){
  if(bgmIdx >= bgmSources.length){ console.warn('bgm_1 not found — put bgm_1.mp3 next to index.html'); return; }
  bgm.src = bgmSources[bgmIdx]; bgm.load();
}
bgm.addEventListener('error', () => { bgmIdx++; loadBgm(); });
bgm.addEventListener('canplay', () => { bgmReady = true; if(bgmWanted) tryPlay(); });
function tryPlay(){ if(SETTINGS.muted) return; const p = bgm.play(); if(p && p.catch) p.catch(()=>{}); }
function startMusic(){ bgmWanted = true; if(bgmReady) tryPlay(); }
function applyMute(){
  $('btnMute').textContent = SETTINGS.muted ? '🔇' : '🔊';
  if(SETTINGS.muted) bgm.pause(); else if(bgmWanted) tryPlay();
}
loadBgm();
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>startMusic(),{once:true}));

let ac;
function tone(freq,dur,type='sine',vol=.15,delay=0){
  if(!SETTINGS.sfx || SETTINGS.muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    const t = ac.currentTime+delay, o = ac.createOscillator(), g = ac.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const sfx = {
  good(){ tone(523,.18,'triangle');tone(659,.18,'triangle',.15,.1);tone(784,.35,'triangle',.15,.2) },
  bad(){ tone(220,.25,'sawtooth',.1);tone(165,.4,'sawtooth',.1,.15) },
  click(){ tone(660,.07,'square',.05) },
  tick(){ tone(880,.05,'square',.04) },
  win(){ [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.28,'triangle',.14,i*.12)) }
};

/* ================= GAME ================= */
let order=[], idx=0, score=0, points=0, streak=0, bestStreak=0, history=[];
let timerId=null, tLeft=0, tMax=0, locked=false, started=false, revMode='play';

function newGame(){
  order = shuffle(WORKS); idx=0; score=0; points=0; streak=0; bestStreak=0; history=[]; started=true;
  $('dots').innerHTML = order.map(()=>'<b></b>').join('');
  show('quiz'); loadQuestion();
}
function updateDots(){
  [...$('dots').children].forEach((d,i)=>{ d.className = i<history.length ? (history[i].correct?'ok':'bad') : (i===idx?'cur':''); });
}
function loadQuestion(){
  const w = order[idx]; locked=false;
  $('roundLbl').textContent = `Round ${idx+1} of ${order.length}`;
  $('scoreLbl').textContent = `SCORE ${points}`;
  $('streakLbl').textContent = `🔥 STREAK ${streak}`;
  $('bookTitle').textContent = w.t;
  const b = $('book'); b.style.animation='none'; void b.offsetWidth; b.style.animation='';
  setMas('mQuiz','think');
  fitTitle();
  $('btnYes').disabled = $('btnNo').disabled = false;
  updateDots(); startTimer();
}
// shrink the title until it fits inside the book's gold frame (works for any font / screen size)
function fitTitle(){
  const bt = $('bookTitle'), bk = $('book');
  if(!bt || !bk.clientWidth) return;
  let size = Math.max(14, Math.min(bk.clientWidth*0.15, 46));
  bt.style.fontSize = size + 'px';
  const maxH = bk.clientHeight*0.5;
  let guard = 60;
  while(guard-- > 0 && size > 9 && (bt.scrollWidth > bt.clientWidth + 1 || bt.scrollHeight > maxH)){ size -= 1; bt.style.fontSize = size + 'px'; }
}
addEventListener('resize', fitTitle);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
function startTimer(){
  clearInterval(timerId);
  const bar = $('tbar');
  if(!SETTINGS.timer){ bar.style.visibility='hidden'; return; }
  bar.style.visibility='visible';
  tMax = tLeft = SETTINGS.timer;
  $('tfill').style.transform='scaleX(1)'; bar.classList.remove('low');
  const t0 = performance.now(); let lastSec = tMax;
  timerId = setInterval(()=>{
    tLeft = Math.max(0, tMax - (performance.now()-t0)/1000);
    $('tfill').style.transform = `scaleX(${tLeft/tMax})`;
    bar.classList.toggle('low', tLeft <= 3);
    const sec = Math.ceil(tLeft);
    if(sec<=3 && sec!==lastSec && sec>0) sfx.tick();
    lastSec = sec;
    if(tLeft<=0){ clearInterval(timerId); answer(null); }
  },50);
}
function answer(choice){ // true=YES, false=NO, null=timeout
  if(locked) return; locked=true; clearInterval(timerId);
  $('btnYes').disabled = $('btnNo').disabled = true;
  const w = order[idx];
  const correct = choice !== null && (choice === !!w.s);
  let gain = 0, bonusTxt = '';
  if(correct){
    score++; streak++; bestStreak=Math.max(bestStreak,streak);
    gain = 100;
    if(SETTINGS.timer) gain += Math.round(50 * (tLeft/tMax));
    if(streak%5===0){ gain += 250; bonusTxt = `🔥 ${streak}-STREAK BONUS +250!`; }
    points += gain; sfx.good();
  } else { streak=0; sfx.bad(); }
  history.push({w, picked:choice, correct});
  revMode = 'play';
  fillReveal(w, choice, correct, gain, bonusTxt);
  $('btnNext').textContent = idx === order.length-1 ? 'See Results 🏆' : 'Next Question →';
  show('reveal');
  $('stage').classList.remove('flashG','flashR'); void $('stage').offsetWidth;
  $('stage').classList.add(correct?'flashG':'flashR');
  if(!correct) $('verdict').classList.add('shake');
  if(correct && bonusTxt) burst(60);
}
function setMini(w){
  const mini = $('mini'), file = COVER_FILES[w.t];
  mini.dataset.t = w.t;
  const fallback = (missing) => {
    mini.className = 'mini';
    mini.style.background = `linear-gradient(160deg,hsl(${w.hue} 55% 32%),hsl(${w.hue} 60% 12%))`;
    mini.innerHTML = `<div class="g">${w.g}</div><div class="tt">${w.t}</div><div class="au">${w.s?'SHAKESPEARE':w.a.replace('Traditionally attributed to ','').toUpperCase()}</div>` + (missing && file ? `<div class="miss">📁 ${file}</div>` : '');
  };
  fallback(false);
  findCover(w).then(src => {
    if(mini.dataset.t !== w.t) return;
    if(!src){ fallback(true); return; }
    const img = new Image(); img.alt = w.t + ' cover'; img.src = src;
    mini.className = 'mini hasimg'; mini.style.background = '#000';
    mini.innerHTML = ''; mini.appendChild(img);
  });
}
function fillReveal(w, choice, correct, gain, bonusTxt){
  const timedOut = choice===null;
  const v = $('verdict');
  v.className = 'vbar ' + (correct?'ok':'bad');
  const head = correct ? 'Correct!' : (timedOut ? 'Time’s up!' : 'Not quite!');
  const sub = w.s ? (correct ? 'Shakespeare wrote this work.' : 'Shakespeare DID write this work.') : 'This work was not written by Shakespeare.';
  v.innerHTML = `<div class="vtop"><span class="vicon">${correct?'✔':'✖'}</span><span>${head}</span></div><div class="vsub">${sub}</div>`;
  setMini(w);
  $('rPill').textContent = w.s ? 'Short Synopsis' : 'Author';
  $('rAuth').textContent = w.s ? '' : w.a;
  $('rHead').textContent = w.head;
  $('rBody').textContent = w.body;
  if(w.s){ $('rFocusL').textContent = 'Literary Focus:'; $('rFocus').textContent = w.foc + ' Think: ' + w.think; }
  else   { $('rFocusL').textContent = 'Did You Know?';  $('rFocus').textContent = w.foc; }
  $('bonus').textContent = bonusTxt || (correct && gain ? `+${gain} pts` : '');
  setMas('mRev', correct ? 'happy' : 'surprised');
}
function next(){
  sfx.click();
  if(revMode === 'review'){ show('review'); return; }
  idx++;
  if(idx >= order.length) return finish();
  show('quiz'); loadQuestion();
}
function finish(){
  started=false; clearInterval(timerId);
  const n = order.length, r = RANKS.find(r=>score>=r[0]);
  $('finalScore').textContent = score;
  $('stC').textContent = score; $('stI').textContent = n-score;
  $('stR').textContent = r[1];
  $('rank').textContent = r[2] + `  ·  ${points} pts · best streak ${bestStreak}`;
  setMas('mRes','cheer');
  const hs = store.get('scores',[]);
  hs.push({score, points, date:new Date().toLocaleDateString()});
  hs.sort((a,b)=>b.score-a.score||b.points-a.points);
  store.set('scores', hs.slice(0,8));
  show('result'); sfx.win(); burst(score>=13?200:80);
}
function openReview(){
  $('rvGrid').innerHTML = history.map((h,i)=>`<button class="rvRow" data-i="${i}"><span class="n ${h.correct?'ok':'bad'}">${i+1}</span><span class="t">${h.w.t}</span><span class="mk ${h.correct?'ok':'bad'}">${h.correct?'✔':'✖'}</span></button>`).join('');
  $('rvGrid').querySelectorAll('.rvRow').forEach(b=>b.onclick=()=>{
    const h = history[+b.dataset.i]; sfx.click();
    revMode = 'review';
    fillReveal(h.w, h.picked, h.correct, 0, '');
    $('btnNext').textContent = '← Back to Answers';
    show('reveal');
  });
  show('review');
}

   <div class="srow"><label>Countdown</label><div class="seg">${seg('timer',[[0,'Off'],[5,'5s'],[10,'10s'],[15,'15s']])}</div></div>
   <div class="srow"><label>Music</label><div class="seg">${seg('muted',[[false,'On'],[true,'Off']])}</div></div>
   <div class="srow"><label>Music volume</label><input type="range" id="vol" min="0" max="100" value="${Math.round(SETTINGS.volume*100)}"></div>
   <div class="srow"><label>Sound effects</label><div class="seg">${seg('sfx',[[true,'On'],[false,'Off']])}</div></div>
   <div class="srow"><label>High scores</label><span id="clr" style="cursor:pointer;color:var(--red);font-weight:900">Reset</span></div>
   <p style="text-align:center;margin-top:1.6vh"><button class="btn-gold sm" onclick="closeModal()">Done</button></p>`);
  $('mbox').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; let v=b.dataset.v;
    v = (v==='true')?true:(v==='false')?false:Number(v);
    SETTINGS[k]=v; saveSettings();
    b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    if(k==='muted') applyMute(); sfx.click();
  });
  $('vol').oninput = e => { SETTINGS.volume = e.target.value/100; bgm.volume = SETTINGS.volume; saveSettings(); };
  $('clr').onclick = () => { store.set('scores',[]); $('clr').textContent='Cleared ✓'; };
}
function scores(){
  const hs = store.get('scores',[]);
  openModal(`<button class="close">✕</button><h2>High Scores 🏆</h2>` +
    (hs.length ? hs.map((h,i)=>`<div class="hs"><span>${['🥇','🥈','🥉'][i]||(i+1)+'.'} ${h.score}/20</span><span>${h.points} pts</span><span>${h.date}</span></div>`).join('')
               : `<p style="text-align:center">No scores yet — be the first on the Bard's wall of fame!</p>`) +
    `<p style="text-align:center;margin-top:1.6vh"><button class="btn-gold sm" onclick="closeModal()">Close</button></p>`);
}

/* ================= FULLSCREEN + WIRING ================= */
function toggleFs(){
  const d=document, el=d.documentElement;
  if(!d.fullscreenElement && !d.webkitFullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||(()=>{})).call(el); }
  else { (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
}
$('btnPlay').onclick = () => {
  sfx.click(); startMusic();
  if(!document.fullscreenElement){ try{ document.documentElement.requestFullscreen().catch(()=>{}) }catch(e){} }
  newGame();
};
$('btnYes').onclick = () => answer(true);
$('btnNo').onclick  = () => answer(false);
$('btnNext').onclick = next;
$('btnAgain').onclick = () => { sfx.click(); newGame(); };
$('btnReview').onclick = () => { sfx.click(); openReview(); };
$('btnBack').onclick = () => { sfx.click(); show('result'); };
$('btnHow').onclick = howTo;
$('btnSettings').onclick = settings;
$('btnScores').onclick = scores;
$('btnFs').onclick = toggleFs;
$('btnMute').onclick = () => { SETTINGS.muted=!SETTINGS.muted; saveSettings(); startMusic(); applyMute(); };
$('btnHome').onclick = () => {
  if(started && !confirm('Leave the game and return to the main menu?')) return;
  clearInterval(timerId); started=false; closeModal(); show('title'); $('quip').textContent = QUIPS[0];
};
window.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  const k = e.key.toLowerCase();
  if(k==='m'){ $('btnMute').click(); return; }
  if(k==='f'){ toggleFs(); return; }
  if(k==='escape'){ if($('modal').classList.contains('on')) closeModal(); return; }
  if($('modal').classList.contains('on')) return;
  const cur = document.querySelector('.scene.on').id;
  if(cur==='quiz'){
    if(k==='y'||k==='arrowleft'||k==='1') answer(true);
    if(k==='n'||k==='arrowright'||k==='2') answer(false);
  } else if(cur==='reveal'){
    if(k==='enter'||k===' '||k==='arrowright'){ e.preventDefault(); next(); }
  } else if(cur==='title'){
    if(k==='enter'||k===' '){ e.preventDefault(); $('btnPlay').click(); }
  }
});
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) bgm.pause(); else if(bgmWanted && !SETTINGS.muted) tryPlay(); });

/* ================= SPARKLES ================= */
(function(){
  const c=$('sparks'), x=c.getContext('2d'); let S=[];
  function size(){ c.width=innerWidth; c.height=innerHeight;
    S=Array.from({length:70},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*2.6+.6,p:Math.random()*6,v:Math.random()*.25+.05,star:Math.random()<.35})) }
  size(); addEventListener('resize',size);
  (function loop(t){ x.clearRect(0,0,c.width,c.height);
    S.forEach(s=>{
      s.y -= s.v; if(s.y<-10){ s.y=c.height+10; s.x=Math.random()*c.width }
      const a = .25+.75*Math.abs(Math.sin(t/1100+s.p));
      x.globalAlpha=a; x.fillStyle='#ffd98a'; x.shadowColor='#ffb84a'; x.shadowBlur=10;
      if(s.star){ const R=s.r*2.6; x.beginPath(); x.moveTo(s.x,s.y-R); x.quadraticCurveTo(s.x,s.y,s.x+R,s.y); x.quadraticCurveTo(s.x,s.y,s.x,s.y+R); x.quadraticCurveTo(s.x,s.y,s.x-R,s.y); x.quadraticCurveTo(s.x,s.y,s.x,s.y-R); x.fill(); }
      else { x.beginPath(); x.arc(s.x,s.y,s.r,0,7); x.fill(); }
    });
    requestAnimationFrame(loop) })(0);
})();

/* ================= CONFETTI ================= */
const cv=$('confetti'), cx=cv.getContext('2d'); let parts=[], running=false;
function sizeC(){ cv.width=innerWidth; cv.height=innerHeight } sizeC(); addEventListener('resize',sizeC);
function burst(n){
  const cols=['#f2b93a','#c4172f','#2fb455','#3b6fe0','#ffe28a','#fff'];
  for(let i=0;i<n;i++) parts.push({x:innerWidth/2+(Math.random()-.5)*300,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,
    w:6+Math.random()*7,h:4+Math.random()*6,c:rand(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4,l:140+Math.random()*80});
  if(!running){ running=true; requestAnimationFrame(tick) }
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.l-->0 && p.y<innerHeight+30);
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.vx*=.99; p.r+=p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.globalAlpha=Math.min(1,p.l/40); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore() });
  if(parts.length) requestAnimationFrame(tick); else { running=false; cx.clearRect(0,0,cv.width,cv.height) }
}

// background photo: looks for bg.jpg (also .jpeg/.png/.webp, or background.*, stage.*) next to index.html or in images/, img/, assets/ ...
// If none is found, the original CSS library scene is kept, so nothing breaks.
(function(){
  const dirs = ['', 'images/', 'img/', 'assets/', 'covers/', 'pictures/'];
  const names = ['bg', 'bgp', 'background', 'stage', 'BG'];
  const exts = ['.jpg', '.jpeg', '.png', '.webp'];
  const list = [];
  for(const n of names) for(const d of dirs) for(const e of exts) list.push({u:d+n+e});
  tryList(list).then(hit => {
    if(!hit) return;
    const st = $('stage');
    st.style.setProperty('--bgurl', `url("${hit.u}")`);
    st.classList.add('hasbg');
  });
})();
